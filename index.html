<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=atkinson-hyperlegible:400,400i,700,700i"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="game.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Atkinson Hyperlegible", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ultimate Tic Tac Toe</h1>
      <h2 id="status">Player X's turn</h2>
      <div class="controls">
        <div class="mode-buttons">
          <button data-mode="pvp">Player vs Player</button>
          <button data-mode="pvc">Player vs Computer</button>
          <button data-mode="cvc">Computer vs Computer</button>
        </div>

        <div class="difficulty-buttons">
          Difficulty:
          <button data-difficulty="easy">Easy</button>
          <button data-difficulty="medium">Medium</button>
          <button data-difficulty="hard">Hard</button>
          <button data-difficulty="impossible">Impossible</button>
        </div>

        <button id="reset">Reset Game</button>
      </div>
    </header>
    <main>
      <div id="ultimate-board">
        <div class="sub-board" id="sub-board-1"></div>
        <div class="sub-board" id="sub-board-2"></div>
        <div class="sub-board" id="sub-board-3"></div>
        <div class="sub-board" id="sub-board-4"></div>
        <div class="sub-board" id="sub-board-5"></div>
        <div class="sub-board" id="sub-board-6"></div>
        <div class="sub-board" id="sub-board-7"></div>
        <div class="sub-board" id="sub-board-8"></div>
        <div class="sub-board" id="sub-board-9"></div>
      </div>
    </main>
    <footer>&copy; 2025</footer>
  </body>
</html>
